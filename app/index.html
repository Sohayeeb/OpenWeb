<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="openweb:browser" content="on" />
    <title>OpenWeb — a small web, served by its writers</title>
    <meta
      name="description"
      content="A peer-to-peer web. Every page is a file on a real computer, published under a key. No ads, no trackers, no AI, no hosting bill."
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="newtab">
    <div class="nt-shell">
      <header class="nt-bar">
        <a class="brand" href="/">Open<span>Web</span></a>

        <details class="launcher">
          <summary aria-label="Apps" title="Apps">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </summary>
          <nav class="launcher-panel" aria-label="OpenWeb apps">
            <a href="/"><span class="glyph">⌂</span>new tab</a>
            <a href="/directory.html"><span class="glyph">✓</span>directory</a>
            <a href="/search.html"><span class="glyph">⌕</span>search</a>
            <a href="/publish.html"><span class="glyph">↑</span>publish</a>
            <a href="/builder.html"><span class="glyph">✎</span>builder</a>
            <a href="/about.html"><span class="glyph">i</span>about</a>
            <a href="/garden.html"><span class="glyph">❧</span>garden</a>
            <a href="/coffee.html"><span class="glyph">◔</span>coffee</a>
            <a href="/hello.html"><span class="glyph">✉</span>hello</a>
          </nav>
        </details>
      </header>

      <main class="nt-main">
        <a class="nt-mark" href="/">Open<span>Web</span></a>
        <p class="nt-tagline">a small web, served by the people who write it</p>

        <form class="nt-search" action="/search" method="get" role="search">
          <input
            type="search"
            name="q"
            placeholder="search the pages this machine has read"
            aria-label="Search OpenWeb"
            autocomplete="off"
            autofocus
          />
          <button type="submit">search</button>
        </form>

        <p class="nt-hint">
          no query leaves this machine · no ads · no trackers · no AI
        </p>

        <nav class="nt-shortcuts" aria-label="Shortcuts">
          <a href="/directory.html">directory</a>
          <a href="/publish.html">publish</a>
          <a href="/builder.html">builder</a>
          <a href="/about.html">about</a>
        </nav>
      </main>

      <footer class="nt-foot">
        <span>signed by a key · served by a peer</span>
        <span class="tiny">draft 0.2</span>
      </footer>
    </div>
  </body>
</html>
