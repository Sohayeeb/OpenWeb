name: beta

# Beta is complete but still being tested. Pushing to beta opens a deployment
# job in the `beta` environment; configure required reviewers in the repository
# settings so the release waits for a human.
on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Stamp the beta version
        shell: pwsh
        run: |
          $version = "0.1.0-beta.${{ github.run_number }}"
          npm version $version --no-git-tag-version --allow-same-version -w @openweb/desktop

      - name: Test
        run: npm test

      - name: Build the installer
        env:
          OPENWEB_CHANNEL: beta
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package

      - name: Publish the prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./packages/desktop/package.json').version"
          $assets = @(
            "release/OpenWeb-$version-x64.exe"
            "release/OpenWeb-$version-x64.exe.blockmap"
          )
          $assets += Get-ChildItem release -Filter '*.yml' |
            Where-Object { $_.Name -in @('latest.yml', 'beta.yml', 'nightly.yml') } |
            ForEach-Object { $_.FullName }
          gh release create "v$version" $assets --title $version --prerelease --generate-notes

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: openweb-beta-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
